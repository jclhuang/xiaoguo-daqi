name: 更新影片與文章
on:
  schedule: [{cron: "17 */3 * * *"}]   # 每 3 小時
  push: {paths: ["posts/**", "posts.json", "data/overrides.json", "data/topics.json"]}
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python scripts/update.py
      - run: |
          git config user.name "xgdq-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/videos.json data/posts.json
          git diff --cached --quiet || (git commit -m "自動更新影片/文章" && git push)
